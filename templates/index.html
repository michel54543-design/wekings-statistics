<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#090908">
  <title>Wekings — статистика игроков</title>
  <link rel="icon" href="/static/favicon.ico?v=41" sizes="any">
  <link rel="icon" href="/static/favicon.svg?v=41" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/static/apple-touch-icon.png?v=41">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body class="dark">
  <main class="page">
    <header class="site-header">
      <img class="site-mark" src="/static/wekings-gold.svg" alt="">
      <div class="site-heading">
        <p class="brand">WEKINGS</p>
        <h1>Wekings Статистика</h1>
        <p class="status"><i></i><span id="statusText">Проверяем состояние базы…</span></p>
      </div>
      <time id="todayBadge" class="today-badge"></time>
    </header>

    <nav class="modes" aria-label="Режим статистики">
      <button data-mode="general" class="active"><span class="mode-icon">▥</span>Общий</button>
      <button data-mode="growth"><span class="mode-icon">↗</span>Прирост</button>
      <button data-mode="best"><span class="mode-icon">★</span>Лучшие <small>за 30 дней</small></button>
      <button data-mode="stats"><span class="mode-icon">≡</span>Едина</button>
      <button data-mode="clans"><span class="mode-icon">♜</span>Кланы</button>
      <button data-mode="brotherhoods"><span class="mode-icon">♛</span>Братства</button>
    </nav>

    <section id="filters" class="controls">
      <label id="fromWrap" class="date-control hidden"><span>От</span><select id="dateFrom"></select></label>
      <label id="toWrap" class="date-control hidden"><span id="toLabel">Снимок данных</span><select id="dateTo"></select></label>
      <label><span>Показатель</span>
        <select id="sort">
          <option value="glory">Слава</option>
          <option value="stat_sum">Сумма характеристик</option>
          <option value="power" selected>Сила</option>
          <option value="defense">Защита</option>
          <option value="agility">Ловкость</option>
          <option value="mastery">Мастерство</option>
          <option value="vitality">Живучесть</option>
          <option value="wins">Победы</option>
          <option value="losses">Поражения</option>
          <option value="dragon_wins">Победы над Драконом</option>
          <option value="serpent_wins">Победы над Змеем</option>
          <option value="beasts_killed">Убито зверей</option>
          <option value="silver_stolen">Награбил (серебро)</option>
          <option value="silver_lost">Потерял (серебро)</option>
          <option value="crystals_stolen">Награбил (кристаллы)</option>
          <option value="crystals_lost">Потерял (кристаллы)</option>
        </select>
      </label>
      <label><span>Уровень</span>
        <select id="level">
          <option value="">Введите уровень</option>
        </select>
      </label>
      <label class="search"><span>Поиск по нику</span><input id="query" placeholder="Введите ник игрока…"></label>
      <button id="find">Найти</button>
      <button id="filterToggle" class="filter-toggle" title="Дополнительные фильтры" aria-label="Дополнительные фильтры">☷</button>
    </section>

    <section id="playerDetail" class="player-detail hidden">
      <div class="detail-head">
        <div>
          <p>Личная статистика</p>
          <h2 id="detailName">Игрок</h2>
          <div id="detailMeta" class="detail-meta"></div>
        </div>
        <a id="detailProfile" target="_blank" rel="noreferrer">Открыть профиль Wekings ↗</a>
      </div>
      <div class="detail-dates">
        <label><span>Сравнить от</span><select id="detailFrom"></select></label>
        <label><span>до</span><select id="detailTo"></select></label>
      </div>
      <div id="detailMetrics" class="metric-grid"></div>
    </section>

    <section class="card">
      <div class="card-head">
        <div><h2 id="tableTitle">Рейтинг: Сила</h2><p>Данные напрямую из профилей Wekings</p></div>
        <span id="resultCount">—</span>
      </div>
      <div class="table-wrap">
        <table id="rankingTable">
          <thead id="tableHead"><tr><th>№</th><th>Игрок</th><th>Ур.</th><th>Братство</th><th>Клан</th><th id="metricTitle">Сила</th><th>Прирост</th></tr></thead>
          <tbody id="rows"><tr><td colspan="7" class="loading">Загрузка статистики…</td></tr></tbody>
        </table>
      </div>
      <footer>
        <button id="prev">← Назад</button>
        <span id="pageText">Страница 1</span>
        <button id="next">Вперёд →</button>
      </footer>
    </section>
  </main>
  <nav class="mobile-nav" aria-label="Основные разделы">
    <button data-mobile-mode="general" class="active"><span class="nav-icon">♜</span>Топ</button>
    <button data-mobile-mode="growth"><span class="nav-icon">↗</span>Прирост</button>
    <button id="mobilePlayer"><span class="nav-icon">♙</span>Игрок</button>
  </nav>
  <div id="copyToast" class="copy-toast" role="status">Ник скопирован</div>
  <script src="/static/app.js"></script>
</body>
</html>
